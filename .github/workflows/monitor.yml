# 1분 간격 버전: 1시간마다 작업을 시작하고, 시작되면 약 55분 동안 1분마다 확인합니다.
# 저장소의 .github/workflows/monitor.yml 내용을 이 파일로 통째로 바꾸세요.
name: PokeHive monitor

on:
  schedule:
    - cron: "0 * * * *"      # 매시 정각에 시작 (GitHub 사정으로 몇 분 늦게 시작될 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # state.json 을 저장소에 커밋하기 위해 필요

concurrency:
  group: pokehive-monitor
  cancel-in-progress: false   # 이전 작업이 끝날 때까지 다음 작업은 대기 (중복 실행 방지)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check every minute for ~55 minutes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          KEYWORDS: ${{ secrets.KEYWORDS }}
          BUY_QTYS: ${{ secrets.BUY_QTYS }}
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 55*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            python monitor.py || echo "이번 회차 실패, 다음 회차에 다시 시도"
            # 상태가 바뀌었을 때만 저장 (작업이 중간에 끊겨도 기록이 남도록 매번 저장)
            git add state*.json
            if ! git diff --cached --quiet; then
              git commit -q -m "update state"
              git pull -q --rebase && git push -q || echo "저장 실패, 다음 회차에 다시 시도"
            fi
            # 1분 간격 맞추기
            sleep $(( 60 - ( $(date +%s) - start ) > 0 ? 60 - ( $(date +%s) - start ) : 1 ))
          done
